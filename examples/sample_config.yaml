### Config for the sample data in data/ (LiDAR scan and PVGIS typical meteorological year for Freiburg), with the settings of the
### legacy code. Run from the repository root:
###   pv-yield-estimator run -s data/2026-06-01_22-25-29_red_red.csv -w data/Freiburg-pvgis-tmy.csv -c examples/sample_config.yaml -d results/sample
### Without -w, `run` downloads weather data for the site (site.latitude/longitude or site.query); without -s, the sky is free (no obstruction).
format_version: 1
site: {}                            ### latitude/longitude/altitude, or query: "place name or address"; taken from the weather file if not given
weather:
  source: auto                      ### file format: auto (detected), pvgis_tmy (as data/Freiburg-pvgis-tmy.csv), open_meteo or tmy3 (e.g. MeteoNorm)
  download_service: auto            ### for downloads: auto (PVGIS, else Open-Meteo), pvgis_tmy or open_meteo
  n_years: 10                       ### Open-Meteo: number of past years averaged into a typical year
sky_obstruction:
  method: lidar
  lidar:
    scanner_heading_deg: 188.1      ### compass azimuth of the scanner's x axis (legacy lidar_yaw_deg -81.9)
    panel_offset_m: [0.0, 0.0, 0.0] ### panel position relative to the scanner [east, north, up]
    min_points: 10                  ### minimum number of points in an obstructed sky patch
  photo:
    fov_deg: 65                     ### browser app: camera field of view across the photo's longer side, default for new photos
  ar_video:                         ### point cloud from an AR recording (#48); defaults shown
    feature: orb                    ### orb or sift
    max_features: 2000              ### per frame, spread over a grid of 6 × 3 cells (feature_grid), after local contrast enhancement
    max_image_px: 960               ### frames downscaled to this longer side
    max_turn_rate_deg_s: 20         ### frames taken while turning faster are blurred and skipped
    min_baseline_m: 0.05            ### frame pairs: at least this far apart (short for near objects) ...
    max_pairs_per_frame: 8          ### ... with viewing directions at most half the field of view apart (max_view_angle_deg)
    max_pose_error_px: 20           ### matches near the epipolar line of the recorded poses, then checked against the images (ransac_px: 1.5)
    adjust_poses: true              ### refine the recorded poses from the images (bundle adjustment) ...
    rotation_prior_deg: 1.0         ### ... staying within about this of the recorded orientation ...
    position_prior_m: 0.05          ### ... and position; frames needing more than 3° or 0.3 m are dropped
    min_triangulation_angle_deg: 2.0  ### points need this much parallax ...
    min_distance_m: 0.1             ### ... and this distance from the cameras
panel:
  tilt_deg: 15                      ### null (or left out): optimized
  azimuth_deg: 180                  ### compass: 180 = south; null (or left out): optimized
  area_m2: 1.0
  efficiency: 0.20
  performance_ratio: 0.80
orientation:
  tilt_step_deg: 1                  ### grid of the orientation comparison
  azimuth_step_deg: 2
  compare: [[30, 180], [30, 90], [30, 270], [90, 180]]   ### further orientations [tilt, azimuth] in the comparison table
simulation:
  n_sky_nodes: 500                  ### approximate number of sky nodes (default 500); about twice as many sky patches
output:
  plots_html: true                  ### interactive plots (plots.html)
  plots_png: true                   ### static plots (plot_*.png)
  pdf_report: true                  ### report.pdf
