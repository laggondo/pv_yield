### Local development and CI environment (conda-forge only). Create with:
###   conda env create -f environment.yml && conda activate pv_yield_estimator
### Python 3.14 matches Pyodide 314.x, which runs the browser app.
name: pv_yield_estimator
channels:
  - conda-forge
dependencies:
  - python=3.14
  - numpy
  - scipy
  - pandas
  - pvlib
  - pyyaml
  - rich
  - matplotlib
  - contourpy
  - bokeh=3.9
  ### Point cloud from AR recordings (#48): Pyodide bundles OpenCV 4.11, which conda-forge doesn't build for Python 3.14; 4.13 is the closest.
  - py-opencv=4.13
  - pillow
  - pytest
